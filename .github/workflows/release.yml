# Builds downloadable releases.
#
#   * Push a tag like `v0.1.0` (matching the version in Cargo.toml / tauri.conf.json): builds
#     everything and publishes a GitHub Release with the files below plus SHA256SUMS.
#   * Run it manually (Actions -> Release -> Run workflow): builds everything and attaches the
#     files to the workflow run as artifacts, without publishing a release.
#
# Files:
#   MCServerCenter-Setup-<version>-x64.exe           Windows installer (no admin rights needed)
#   MCServerCenter-<version>-windows-x64-portable.zip  the same app, unzip-and-run
#   MCServerCenter-<version>-linux-x86_64.tar.gz       headless Linux service + installer
#   MCServerCenter-linux-x86_64.tar.gz + install-linux.sh  same, under stable names for
#                                                      the one-command VPS installer
#
# Code signing: once SignPath is set up (docs/CODE_SIGNING.md), tagged releases sign the
# programs, then package and sign the installer. Each step waits for the signing request to be
# approved on signpath.io. Without that setup, the files are built unsigned.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Read version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          app=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "$version" != "$app" ]; then
            echo "::error::Cargo.toml version ($version) and tauri.conf.json version ($app) differ"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version v$version; bump the version first"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows app
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Signs only tagged releases, and only once SignPath is set up (docs/CODE_SIGNING.md).
      # Without it, releases are built unsigned exactly as before.
      SIGN: ${{ github.ref_type == 'tag' && secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Build the service and command-line tool
        run: cargo build --release --locked -p msmd -p msmctl

      # Built first and packaged later, so the programs inside the installer can be signed
      # before the installer is made.
      - name: Build the app
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          node scripts/stage-sidecar.mjs
          pnpm tauri build --no-bundle --config src-tauri/tauri.release.conf.json

      # ---- Code signing, pass 1: the programs (see docs/CODE_SIGNING.md) ----
      - name: Collect the programs to sign
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force to-sign/programs | Out-Null
          Copy-Item target/release/msm-desktop.exe, target/release/msmd.exe, target/release/msmctl.exe to-sign/programs
      - id: upload-programs
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-programs
          path: to-sign/programs/*
          if-no-files-found: error
      - name: Sign the programs (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mc-server-center' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-programs.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing is approved by hand on signpath.io; allow time for that.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/programs
      - name: Use the signed programs
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          foreach ($f in 'msm-desktop.exe', 'msmd.exe', 'msmctl.exe') {
            $sig = Get-AuthenticodeSignature "signed/programs/$f"
            if ($sig.Status -ne 'Valid') { throw "$f is not validly signed: $($sig.Status) $($sig.StatusMessage)" }
            Copy-Item "signed/programs/$f" target/release -Force
          }
          # The installer bundles msmd as a sidecar; stage the signed copy.
          node apps/desktop/scripts/stage-sidecar.mjs

      - name: Package the installer
        working-directory: apps/desktop
        run: pnpm tauri bundle --config src-tauri/tauri.release.conf.json

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $setup = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "installer not found" }
          Copy-Item $setup.FullName "dist/MCServerCenter-Setup-$env:VERSION-x64.exe"

          $p = "portable/MCServerCenter"
          New-Item -ItemType Directory -Force $p | Out-Null
          Copy-Item target/release/msm-desktop.exe "$p/MC Server Center.exe"
          Copy-Item target/release/msmd.exe, target/release/msmctl.exe $p
          Copy-Item LICENSE-MIT, LICENSE-APACHE $p
          @"
          MC Server Center $env:VERSION (portable)

          Double-click "MC Server Center.exe". Keep msmd.exe in the same folder: it is the background
          service that keeps your servers running after you close the window.

          Your servers and settings are stored in %LOCALAPPDATA%\MinecraftServerManager, not in
          this folder, so you can replace this folder with a newer version at any time.

          msmctl.exe is the optional command-line tool (msmctl help).
          "@ | Set-Content "$p/README.txt"
          Compress-Archive -Path $p -DestinationPath "dist/MCServerCenter-$env:VERSION-windows-x64-portable.zip"
          Get-ChildItem dist

      # ---- Code signing, pass 2: the installer ----
      - id: upload-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: dist/MCServerCenter-Setup-*.exe
          if-no-files-found: error
      - name: Sign the installer (SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mc-server-center' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installer
      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $f = "MCServerCenter-Setup-$env:VERSION-x64.exe"
          $sig = Get-AuthenticodeSignature "signed/installer/$f"
          if ($sig.Status -ne 'Valid') { throw "$f is not validly signed: $($sig.Status) $($sig.StatusMessage)" }
          Copy-Item "signed/installer/$f" dist -Force
          Get-ChildItem dist | ForEach-Object { "{0}  {1}" -f $_.Name, (Get-AuthenticodeSignature $_.FullName).SignerCertificate.Subject }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux service
    needs: version
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build
        run: cargo build --release --locked -p msmd -p msmctl
      - name: Package
        run: |
          name="MCServerCenter-$VERSION-linux-x86_64"
          mkdir -p "$name" dist
          cp target/release/msmd target/release/msmctl "$name/"
          cp packaging/linux/install.sh packaging/linux/msmd.service packaging/linux/README.md "$name/"
          cp LICENSE-MIT LICENSE-APACHE "$name/"
          chmod 0755 "$name/msmd" "$name/msmctl" "$name/install.sh"
          tar -czf "dist/$name.tar.gz" "$name"
          # Stable names for the one-command installer (releases/latest/download/...).
          cp "dist/$name.tar.gz" dist/MCServerCenter-linux-x86_64.tar.gz
          cp packaging/linux/install-online.sh dist/install-linux.sh
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SIGNED: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            signing='The Windows files are signed. Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). Windows may still show a SmartScreen notice for a new release until it has been downloaded enough: choose **More info -> Run anyway**.'
          else
            signing='These builds are not code-signed yet. Windows SmartScreen may say "Windows protected your PC": choose **More info -> Run anyway**.'
          fi
          cat > notes.md <<'EOF'
          ## Download

          | You have | Download |
          |---|---|
          | Windows 10/11 | **MCServerCenter-Setup-…-x64.exe**: run it, then open *MC Server Center* from the Start menu |
          | Windows, no installer | **…-windows-x64-portable.zip**: unzip, run `MC Server Center.exe` |
          | A Linux VPS or server | Run `curl -fsSL https://github.com/${{ github.repository }}/releases/latest/download/install-linux.sh \| sudo sh` and enter the printed address and code in the app (or download **…-linux-x86_64.tar.gz** and run `sudo ./install.sh`) |

          SIGNING_LINE

          You can check the files against `SHA256SUMS`.

          Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.
          EOF
          python3 - "$signing" <<'PY'
          import sys, pathlib
          p = pathlib.Path("notes.md")
          p.write_text(p.read_text().replace("SIGNING_LINE", sys.argv[1]))
          PY
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "MC Server Center $TAG" \
            --notes-file notes.md \
            --generate-notes
