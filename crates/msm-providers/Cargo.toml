[package]
name = "msm-providers"
description = "Download engine with egress policy, and upstream adapters (Mojang, Adoptium, Paper, Fabric, Forge, NeoForge, Modrinth, Cloudflare)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
msm-core.workspace = true
msm-fsguard.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "http2"] }
tokio = { version = "1", features = ["fs", "io-util", "time", "macros"] }
tokio-util = "0.7"
futures-util = { version = "0.3", default-features = false }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
url = { version = "2", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"
tempfile.workspace = true

[lints]
workspace = true
