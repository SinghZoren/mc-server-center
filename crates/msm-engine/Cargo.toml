[package]
name = "msm-engine"
description = "Application services: Java runtimes, server installs, process supervision, backups, networking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
msm-core.workspace = true
msm-fsguard.workspace = true
msm-providers = { path = "../msm-providers" }
tokio = { version = "1", features = ["process", "io-util", "fs", "sync", "time", "macros", "rt"] }
tokio-util = "0.7"
regex = "1"
serde.workspace = true
serde_json = { version = "1", features = ["preserve_order"] }
md-5 = "0.10"
hex = "0.4"
url = "2"
sha2 = "0.10"
fs4 = "0.13"
igd-next = { version = "0.16", features = ["aio_tokio"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
toml = "0.9"
thiserror.workspace = true

[dev-dependencies]
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true

[lints]
workspace = true
