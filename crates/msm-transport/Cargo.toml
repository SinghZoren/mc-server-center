[package]
name = "msm-transport"
description = "Security boundary: local IPC (Windows named pipe / Unix socket) with peer-identity checks, framed message connections."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
msm-core.workspace = true
msm-api = { path = "../msm-api" }
tokio = { version = "1", features = ["net", "io-util", "rt", "time", "sync", "macros"] }
thiserror.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_Pipes",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile.workspace = true

[lints]
workspace = true
